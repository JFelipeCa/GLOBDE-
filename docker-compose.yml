services:

  mysql:
    image: mysql:8.0
    container_name: globde_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: globde
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: globde_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - mysql

volumes:
  mysql_data:
